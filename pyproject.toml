[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equicap"
version = "1.0.0"
description = "Controlled crystal-GNN comparison with a complete-pipeline symmetry audit"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "EquiCap authors" }]
keywords = ["materials", "graph neural network", "crystal", "equivariance", "capsules"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.22",
    "pandas>=1.4",
    "torch>=2.0",
]

[project.optional-dependencies]
progress = ["tqdm>=4.64"]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "tqdm>=4.64",
]

[project.scripts]
equicap = "equicap.cli:console_main"

[project.urls]
Source = "https://github.com/OWNER/equicap"
Issues = "https://github.com/OWNER/equicap/issues"

[tool.setuptools.packages.find]
include = ["equicap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E741"]
